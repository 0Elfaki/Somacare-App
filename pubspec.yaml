name: somacare

description: >-
  SomaCare - student telemedicine. Book and attend video consultations,
  keep a medical history, manage prescriptions and medications, and reach
  an on-call doctor in an emergency.
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Extra packages we need
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  supabase_flutter: ^2.12.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2

  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5

  http: ^1.2.1
  pdf: ^3.11.3
  printing: ^5.14.2




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
